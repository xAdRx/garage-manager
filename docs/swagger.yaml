basePath: /
definitions:
  handlers.CreateVehicleRequest:
    properties:
      brand:
        example: Skoda
        type: string
      doors:
        description: required when type is car
        example: 5
        type: integer
      hasSidecar:
        description: optional when type is motorcycle, default false
        example: false
        type: boolean
      model:
        example: Octavia
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.VehicleType'
        enum:
        - car
        - motorcycle
        example: car
      year:
        example: 2023
        type: integer
    required:
    - brand
    - model
    - type
    - year
    type: object
  handlers.VehicleDoc:
    properties:
      brand:
        example: Volkswagen
        type: string
      doors:
        description: only when type is car
        example: 5
        type: integer
      hasSidecar:
        description: only when type is motorcycle
        example: false
        type: boolean
      id:
        example: 3f2b8c1e-9d4a-4e6b-8a7f-1c2d3e4f5a6b
        format: uuid
        type: string
      model:
        example: Golf
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.VehicleType'
        enum:
        - car
        - motorcycle
        example: car
      year:
        example: 2020
        type: integer
    type: object
  models.VehicleType:
    enum:
    - car
    - motorcycle
    type: string
    x-enum-varnames:
    - TypeCar
    - TypeMotorcycle
info:
  contact: {}
  description: Basic Go REST API.
  title: REST API
  version: "1.0"
paths:
  /vehicles:
    get:
      description: Returns all vehicles. Every filter is optional; filters combine
        with AND.
      parameters:
      - description: Vehicle type
        enum:
        - car
        - motorcycle
        in: query
        name: type
        type: string
      - description: Brand, case-insensitive exact match
        in: query
        name: brand
        type: string
      - description: Model, case-insensitive exact match
        in: query
        name: model
        type: string
      - description: Exact production year
        in: query
        name: year
        type: integer
      - description: Production year from (inclusive)
        in: query
        name: minYear
        type: integer
      - description: Production year to (inclusive)
        in: query
        name: maxYear
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.VehicleDoc'
            type: array
        "400":
          description: Invalid filter value
          schema:
            type: string
      summary: List vehicles
      tags:
      - vehicles
    post:
      consumes:
      - application/json
      description: Adds a car or motorcycle. The server generates the id. Send doors
        only for a car (required, 1-10) and hasSidecar only for a motorcycle (optional,
        default false).
      parameters:
      - description: Vehicle to add
        in: body
        name: vehicle
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateVehicleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.VehicleDoc'
        "400":
          description: Invalid JSON or validation error
          schema:
            type: string
        "413":
          description: Request body larger than 1 MB
          schema:
            type: string
      summary: Add a vehicle
      tags:
      - vehicles
schemes:
- http
- https
swagger: "2.0"
